name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # Repo-level test skip, deliberately NOT GitHub's `[skip ci]`. That marker is
    # honoured by GitHub before any workflow is evaluated, so it suppresses the
    # whole push -- including pages.yml. Five workflow-only commits carrying it
    # left the site undeployed from 2026-08-19 while the legacy Jekyll builder,
    # which ignores the marker, kept republishing the README over the app.
    # `[skip tests]` skips only this gate; the deploy always runs.
    # startsWith, not contains: the marker must open the subject line. contains
    # matches anywhere, so merely naming the marker in a commit body fires it --
    # the exact trap that made e338d8a skip its own gate.
    # e2e and lighthouse `needs: build`, so skipping here cascades to them.
    # Pull requests never skip -- dependabot-auto-merge depends on this gate.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, '[skip tests]')
    runs-on: ubuntu-latest
    # Measured 75s on 2026-09-09 (run 34331746207). The cap is a hang detector,
    # not a performance budget: GitHub's default is 360 minutes, so a wedged
    # npm ci or a build waiting on stdin burns six hours with nothing red.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Type check
        run: npm run type-check
      - name: Validate data and demo sync
        run: npm run validate:full
      - name: Generate demo sync report
        run: npm run check:demos:report
      - name: Upload demo sync report
        uses: actions/upload-artifact@v7
        with:
          name: demo-sync-report
          path: demo-sync-report.json
      - name: Test demo sync CLI
        run: npm run test:demos
      - name: Test
        run: npm run test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build
    # Measured 104s including the Chromium download; 20 leaves room for a cold
    # browser cache without letting a hung Playwright run sit for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    # Measured 70s. The server implementation and dependencies are committed
    # and lockfile-pinned; the cap still catches a failed startup or audit hang.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Serve and audit
        run: |
          npm run serve:static -- -l 3000 &
          sleep 3
          npx lighthouse http://localhost:3000 \
            --chrome-flags="--headless --no-sandbox" \
            --only-categories=accessibility,best-practices,performance \
            --output=json --output-path=./lighthouse-report.json \
            --quiet
          npm run check:lighthouse -- lighthouse-report.json
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: lighthouse-report.json
          retention-days: 7

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: [build, e2e, lighthouse]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    # Measured 10s. The merge loop already sleeps 2x15s between attempts; a cap
    # of 10 minutes only catches a `gh` call that never returns.
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write   # required by the deploy dispatch; without it gh workflow run 403s
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main \
            || echo "::warning::deploy dispatch failed; run pages.yml by hand"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
