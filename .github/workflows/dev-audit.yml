name: Dev dependency audit (reports, never blocks)

# The BLOCKING gate in ci.yml runs `npm audit --omit=dev`, so a vulnerability in
# something that ships to a visitor still stops a merge. This job is the other
# half of that decision: dev-dependency findings stay VISIBLE rather than being
# silenced by the scoping.
#
# Why they are not in the gate. On 2026-10-03 seven high-severity advisories --
# all dev-only, rooted in GHSA-vfj7-8cjw-p6xm (braces stack-exhaustion DoS, CVSS
# 7.5) -- failed EVERY Dependabot pull request on this repository regardless of
# what the PR changed, because `npm audit --audit-level=low` was a gate step.
# Both remedies are semver-major (tailwindcss 4, eslint-config-next), so there
# was no lockfile-only fix and the repository was wedged: the bumps that would
# have cleared the findings could not merge past the findings.
#
# This job therefore reports and never fails. A dev-dependency compromise is a
# real risk -- these packages execute on CI with a token -- so the answer is to
# keep looking, not to stop looking.

on:
  schedule:
    # Weekly, Monday 09:00 UTC, an hour after the demo-sync check.
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev-audit:
    runs-on: ubuntu-latest
    # A hang detector, not a performance budget: this job is a few npm calls.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # continue-on-error so a finding is reported and the job still succeeds.
      # The summary below is the deliverable, not the exit code.
      - name: Audit all dependencies, dev included
        id: audit
        continue-on-error: true
        run: npm run audit:dev

      - name: Write the finding to the run summary
        if: always()
        run: |
          {
            echo "## Dev dependency audit"
            echo
            if [ "${{ steps.audit.outcome }}" = "success" ]; then
              echo "No advisories at \`--audit-level=low\`, dev dependencies included."
            else
              echo "Advisories found in dev dependencies. These do NOT block merges —"
              echo "the gate in \`ci.yml\` scopes to \`--omit=dev\` — but they are real and"
              echo "these packages execute on CI with a token."
              echo
              echo '```'
              npm run audit:dev 2>&1 | tail -40 || true
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
